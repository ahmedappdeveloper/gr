let currentView='home',currentTopic=null,currentIndex=0,shuffledPhrases=[],testAnswers=[],testIndex=0,isAnswering=false,onlyNotYet=false,banglaRevealed=false,sessionOkay=0,sessionNochNicht=0;
let learnedMap=JSON.parse(localStorage.getItem('netz_v7_learned')||'{}');
let streakData=JSON.parse(localStorage.getItem('netz_v7_streak')||'{"count":0,"lastDate":""}');
let currentAudio=null;

function speak(text){
if(currentAudio){currentAudio.pause();currentAudio=null}
const url='https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(text)+'&tl=de&client=tw-ob';
currentAudio=new Audio(url);
currentAudio.play().catch(()=>{
if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.88;speechSynthesis.speak(u)}
});
}
function playOkay(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(660,c.currentTime);o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.1);g.gain.setValueAtTime(.11,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.2);o.start();o.stop(c.currentTime+.2)}catch(e){}}
function playCorrect(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.22);o.start();o.stop(c.currentTime+.22)}catch(e){}}
function playWrong(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=200;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.28);o.start();o.stop(c.currentTime+.28)}catch(e){}}

function updateStreak(){const t=new Date().toDateString();if(streakData.lastDate===t)return;const y=new Date();y.setDate(y.getDate()-1);streakData.count=streakData.lastDate===y.toDateString()?streakData.count+1:1;streakData.lastDate=t;localStorage.setItem('netz_v7_streak',JSON.stringify(streakData))}
function showStreak(){const el=document.getElementById('streakBadge');if(streakData.count>0){el.classList.remove('hidden');document.getElementById('streakCount').textContent=streakData.count}}
function saveLearned(){localStorage.setItem('netz_v7_learned',JSON.stringify(learnedMap))}
function getStats(id){const t=topics.find(x=>x.id===id);const total=t.phrases.length;const learned=t.phrases.filter(p=>learnedMap[p.id]).length;return{learned,notYet:total-learned,total,percent:Math.round(learned/total*100)}}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function totalNotYet(){return topics.reduce((s,t)=>s+getStats(t.id).notYet,0)}
function totalPhrases(){return topics.reduce((s,t)=>s+t.phrases.length,0)}

function goHome(){if(currentAudio){currentAudio.pause();currentAudio=null}currentView='home';currentTopic=null;onlyNotYet=false;isAnswering=false;render()}
function startTopic(id,ny=false){currentTopic=topics.find(t=>t.id===id);onlyNotYet=ny;let list=currentTopic.phrases;if(ny){list=list.filter(p=>!learnedMap[p.id]);if(!list.length){alert('এই টপিকের সব ফ্রেজ Okay হয়ে গেছে!');return}}shuffledPhrases=shuffle(list);currentIndex=0;sessionOkay=0;sessionNochNicht=0;banglaRevealed=false;currentView='learn';isAnswering=false;updateStreak();showStreak();render();setTimeout(()=>speak(shuffledPhrases[0].german),450)}
function revealBangla(){banglaRevealed=true;render()}
function markOkay(id){learnedMap[id]=true;saveLearned();sessionOkay++;playOkay();setTimeout(goNext,280)}
function markNochNicht(){sessionNochNicht++;goNext()}
function goNext(){if(currentIndex<shuffledPhrases.length-1){currentIndex++;banglaRevealed=false;render();setTimeout(()=>speak(shuffledPhrases[currentIndex].german),400)}else{if(onlyNotYet){currentView='sessionEnd';render();return}startTest()}}
function startTest(){testAnswers=[];testIndex=0;shuffledPhrases=shuffle(currentTopic.phrases);currentView='test';isAnswering=false;render()}
function selectOption(btn,correct){if(isAnswering)return;isAnswering=true;document.querySelectorAll('.option-btn').forEach(b=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('option-correct')});if(correct){btn.classList.add('option-correct');playCorrect();testAnswers.push(true)}else{btn.classList.add('option-wrong');playWrong();testAnswers.push(false)}setTimeout(()=>{isAnswering=false;if(testIndex<shuffledPhrases.length-1){testIndex++;render()}else{currentView='result';render()}},1050)}

function renderHome(){
const totalNY=totalNotYet(),total=totalPhrases();
return`<section class="text-center mb-12">
<div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm font-medium px-4 py-1.5 rounded-full mb-5">
<span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>${total} German Phrases
</div>
<h2 class="text-4xl md:text-5xl font-bold mb-4 leading-tight tracking-tight">
হাজার হাজার <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">জার্মান ফ্রেজ</span><br>সহজে শিখুন
</h2>
<p class="text-slate-400 text-lg max-w-lg mx-auto">শুনুন → Word Meaning দেখুন → Okay দিন → Model Test দিন</p>
${totalNY>0?`<div class="mt-6 inline-flex items-center gap-2 text-sm text-amber-300/90 bg-amber-500/10 border border-amber-500/20 px-4 py-2 rounded-full">📌 <strong>${totalNY}</strong>টি Noch nicht বাকি</div>`:''}
</section>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
${topics.map(t=>{const s=getStats(t.id);return`
<div class="card-hover glass rounded-2xl p-6 group">
<div class="flex items-start justify-between mb-4">
<div class="w-14 h-14 rounded-2xl bg-emerald-500/15 border border-emerald-500/25 flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">${t.icon}</div>
<span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg">${s.total}</span>
</div>
<h3 class="text-xl font-semibold mb-0.5 group-hover:text-emerald-400 transition-colors">${t.name}</h3>
<p class="text-slate-400 text-sm mb-4">${t.nameEn}</p>
<div class="w-full bg-slate-800/80 rounded-full h-2 mb-3 overflow-hidden"><div class="progress-bar bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full" style="width:${s.percent}%"></div></div>
<div class="flex gap-4 text-xs mb-5"><span class="text-emerald-400 font-medium">✓ ${s.learned} Okay</span><span class="text-slate-400 font-medium">• ${s.notYet} Noch nicht</span></div>
<div class="grid grid-cols-2 gap-2.5">
<button onclick="startTopic(${t.id},false)" class="btn-green text-white text-sm font-semibold py-2.5 rounded-xl">Start</button>
<button onclick="startTopic(${t.id},true)" class="btn-gray text-slate-300 text-sm font-medium py-2.5 rounded-xl ${s.notYet===0?'opacity-40 pointer-events-none':''}">Noch nicht (${s.notYet})</button>
</div></div>`}).join('')}
</div>`}

function renderLearn(){
const p=shuffledPhrases[currentIndex],progress=((currentIndex+1)/shuffledPhrases.length)*100;
return`<div class="mb-8">
<button onclick="goHome()" class="text-slate-400 hover:text-white text-sm mb-5 transition">← সব টপিক</button>
<div class="flex items-center justify-between mb-2"><h2 class="text-lg font-semibold">${currentTopic.icon} ${currentTopic.name}</h2><span class="text-sm text-slate-400">${currentIndex+1} / ${shuffledPhrases.length}</span></div>
<div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden"><div class="progress-bar bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full" style="width:${progress}%"></div></div>
</div>
<div class="glass rounded-3xl p-8 md:p-10 max-w-2xl mx-auto pop">
<div class="flex justify-between items-center mb-7">
<span class="text-xs font-bold tracking-widest text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-lg">PHRASE ${String(currentIndex+1).padStart(2,'0')}</span>
<button onclick="speak('${p.german.replace(/'/g,"\\'")}')" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-emerald-500/20 border border-slate-700 hover:border-emerald-500/50 flex items-center justify-center text-slate-400 hover:text-emerald-400 transition active:scale-95">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
</button>
</div>
<h3 class="text-2xl md:text-3xl font-semibold text-white text-center leading-snug mb-5 tracking-tight">${p.german}</h3>
<div class="h-px bg-gradient-to-r from-transparent via-emerald-500/30 to-transparent mb-5"></div>
${banglaRevealed?`<p class="text-emerald-300 text-xl md:text-2xl text-center mb-7 leading-relaxed font-medium">${p.bangla}</p>`:`<button onclick="revealBangla()" class="w-full mb-7 py-3.5 rounded-2xl border border-dashed border-slate-600 text-slate-400 hover:text-emerald-300 hover:border-emerald-500/40 transition text-sm">বাংলা অর্থ দেখুন</button>`}
<div class="mb-8">
<p class="text-xs text-slate-500 font-medium mb-3 tracking-wide uppercase">Word Meaning</p>
<div class="flex flex-wrap gap-2 justify-center">${(p.words||[]).map(w=>`<div class="word-chip rounded-xl px-3 py-2 text-center min-w-[70px]"><div class="text-sm font-semibold text-white">${w.de}</div><div class="text-xs text-emerald-400/90 mt-0.5">${w.bn}</div></div>`).join('')}</div>
</div>
<div class="grid grid-cols-2 gap-3">
<button onclick="markNochNicht()" class="btn-gray text-slate-300 font-medium py-4 rounded-2xl">Noch nicht</button>
<button onclick="markOkay(${p.id})" class="btn-green text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-2">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>Okay
</button>
</div>
</div>
<p class="text-center text-slate-500 text-sm mt-6">টিপ: আগে নিজে চিন্তা করুন, তারপর বাংলা ও Word Meaning দেখুন</p>`}

function renderTest(){
const p=shuffledPhrases[testIndex];
const wrongs=currentTopic.phrases.filter(x=>x.id!==p.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.bangla);
const options=shuffle([p.bangla,...wrongs]);
return`<div class="mb-8"><div class="flex justify-between mb-2"><h2 class="text-lg font-semibold">📝 Model Test</h2><span class="text-sm text-slate-400">${testIndex+1} / ${shuffledPhrases.length}</span></div>
<div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden"><div class="progress-bar bg-gradient-to-r from-amber-500 to-orange-400 h-2 rounded-full" style="width:${((testIndex+1)/shuffledPhrases.length)*100}%"></div></div></div>
<div class="glass rounded-3xl p-8 max-w-2xl mx-auto pop">
<p class="text-sm text-slate-400 mb-5 text-center">সঠিক বাংলা অর্থ কোনটি?</p>
<h3 class="text-2xl md:text-3xl font-semibold text-center mb-8 leading-snug">${p.german}</h3>
<div class="space-y-3">${options.map((opt,i)=>`<button data-correct="${opt===p.bangla}" onclick="selectOption(this,${opt===p.bangla})" class="option-btn w-full text-left glass hover:border-emerald-500/40 border border-slate-700/80 rounded-2xl px-5 py-4 text-[15px] font-medium transition"><span class="text-emerald-400/80 font-bold mr-3">${String.fromCharCode(65+i)}.</span>${opt}</button>`).join('')}</div>
</div>`}

function renderResult(){
const correct=testAnswers.filter(Boolean).length,total=testAnswers.length,percent=Math.round(correct/total*100),passed=percent>=70;
return`<div class="text-center max-w-md mx-auto pop">
<div class="w-28 h-28 mx-auto mb-6 rounded-full flex items-center justify-center text-5xl ${passed?'bg-emerald-500/15 border-2 border-emerald-500/40':'bg-red-500/15 border-2 border-red-500/40'}">${passed?'🎉':'😔'}</div>
<h2 class="text-3xl font-bold mb-2">${passed?'অভিনন্দন!':'আবার চেষ্টা করুন'}</h2>
<p class="text-slate-400 mb-7">${total}টির মধ্যে <span class="text-white font-semibold">${correct}টি</span> সঠিক</p>
<div class="glass rounded-2xl p-6 mb-8"><div class="text-5xl font-bold mb-1 ${passed?'text-emerald-400':'text-red-400'}">${percent}%</div><p class="text-slate-500 text-sm">${passed?'পাস • দারুণ!':'৭০% পেলে পাস'}</p></div>
<div class="flex flex-col sm:flex-row gap-3 justify-center">
<button onclick="startTopic(${currentTopic.id})" class="btn-green text-white font-semibold px-8 py-3.5 rounded-2xl">আবার প্র্যাকটিস</button>
<button onclick="goHome()" class="btn-gray text-slate-300 font-medium px-8 py-3.5 rounded-2xl">সব টপিক</button>
</div></div>`}

function renderSessionEnd(){
return`<div class="text-center max-w-md mx-auto pop">
<div class="w-24 h-24 mx-auto mb-6 rounded-full bg-emerald-500/15 border-2 border-emerald-500/30 flex items-center justify-center text-4xl">✨</div>
<h2 class="text-2xl font-bold mb-2">সেশন শেষ!</h2>
<p class="text-slate-400 mb-8">Noch nicht প্র্যাকটিস সম্পন্ন</p>
<div class="glass rounded-2xl p-6 mb-8 grid grid-cols-2 gap-4">
<div><div class="text-2xl font-bold text-emerald-400">${sessionOkay}</div><div class="text-xs text-slate-500">Okay</div></div>
<div><div class="text-2xl font-bold text-slate-300">${sessionNochNicht}</div><div class="text-xs text-slate-500">Noch nicht</div></div>
</div>
<button onclick="goHome()" class="btn-green text-white font-semibold px-8 py-3.5 rounded-2xl">হোমে ফিরে যান</button>
</div>`}

function render(){const app=document.getElementById('app');if(currentView==='home')app.innerHTML=renderHome();else if(currentView==='learn')app.innerHTML=renderLearn();else if(currentView==='test')app.innerHTML=renderTest();else if(currentView==='result')app.innerHTML=renderResult();else if(currentView==='sessionEnd')app.innerHTML=renderSessionEnd();showStreak()}
render();
</script>
</body>
</html>
